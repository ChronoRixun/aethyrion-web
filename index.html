<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>404 — Title Not Found</title>
<style>
  :root {
    --void: #0b0d16;
    --void-2: #101322;
    --surface: #161b2e;
    --line: #262d44;
    --ink: #e9ebf5;
    --mute: #888fad;
    --violet: #8b5cf6;
    --magenta: #ec4899;
    --cyan: #38bdf8;
    --grad: linear-gradient(110deg, var(--magenta), var(--violet) 52%, var(--cyan));
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(139,92,246,0.16), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(56,189,248,0.12), transparent 55%),
      linear-gradient(180deg, var(--void-2), var(--void));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.25rem, 4vw, 3rem);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* faint scanlines for the lost-broadcast feel */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0,
      rgba(255,255,255,0.018) 1px,
      transparent 2px,
      transparent 4px
    );
    z-index: 50;
  }

  .shell { width: 100%; max-width: 880px; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 1.6rem;
  }
  .eyebrow .brand {
    font-weight: 700;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
  .eyebrow .live { color: #f87171; }

  .grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: clamp(1.5rem, 4vw, 3rem);
    align-items: center;
  }

  /* ---- signature: the static poster ---- */
  .poster {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #05060a;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02) inset;
    transition: transform 0.15s ease-out;
    will-change: transform;
  }
  .poster canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.65; }
  .poster .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: radial-gradient(circle at 50% 45%, transparent 30%, rgba(5,6,10,0.55) 100%);
  }
  .poster .glitch {
    font-family: var(--mono);
    font-size: 3.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    position: relative;
    text-shadow: 0 0 18px rgba(139,92,246,0.5);
    animation: jitter 3.4s steps(1) infinite;
  }
  .poster .glitch::before,
  .poster .glitch::after {
    content: "404";
    position: absolute;
    inset: 0;
    clip-path: inset(0 0 50% 0);
  }
  .poster .glitch::before { color: var(--magenta); animation: shift-a 2.6s infinite linear; }
  .poster .glitch::after { color: var(--cyan); clip-path: inset(55% 0 0 0); animation: shift-b 3.1s infinite linear; }
  .poster .nosignal {
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.34em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
  }

  @keyframes jitter { 0%,92%,100% { transform: translate(0,0); } 94% { transform: translate(-2px,1px); } 96% { transform: translate(2px,-1px); } 98% { transform: translate(-1px,0); } }
  @keyframes shift-a { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-2px,1px); } 40% { transform: translate(2px,-1px); } 60% { transform: translate(-1px,0); } }
  @keyframes shift-b { 0%,100% { transform: translate(0,0); } 25% { transform: translate(2px,-1px); } 50% { transform: translate(-2px,1px); } 75% { transform: translate(1px,0); } }

  /* ---- detail column ---- */
  .headline {
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 0.85rem;
  }
  .headline span {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .sub { font-size: 1.05rem; color: var(--mute); margin-bottom: 1.4rem; max-width: 42ch; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.4rem;
    font-family: var(--mono);
    font-size: 0.72rem;
  }
  .tag {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    color: var(--mute);
    letter-spacing: 0.04em;
  }
  .tag.match { color: #fca5a5; border-color: rgba(248,113,113,0.35); }

  .pathbar {
    font-family: var(--mono);
    font-size: 0.82rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    margin-bottom: 1.6rem;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pathbar .label { color: var(--mute); }
  .pathbar .q { color: var(--cyan); }
  .pathbar .cursor { color: var(--violet); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.85rem; }
  .btn {
    font-family: var(--sans);
    font-size: 0.92rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 0.72rem 1.25rem;
    cursor: pointer;
    color: #fff;
    background: var(--grad);
    background-size: 180% 180%;
    transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 12px 30px -12px rgba(139,92,246,0.65);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -12px rgba(139,92,246,0.8); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { cursor: default; filter: saturate(0.4) brightness(0.8); transform: none; box-shadow: none; }
  .btn:focus-visible, .ghost:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .ghost {
    font-family: var(--sans);
    font-size: 0.9rem;
    color: var(--mute);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .ghost:hover { color: var(--ink); border-color: var(--line); }

  .result {
    margin-top: 1.1rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: #fca5a5;
    min-height: 1.1rem;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .result.show { opacity: 1; transform: translateY(0); }

  .quip {
    margin-top: 2.4rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--mute);
    letter-spacing: 0.02em;
    transition: opacity 0.45s ease;
  }
  .quip::before { content: "// "; color: var(--violet); }

  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .poster { width: 180px; }
    .sub, .pathbar { max-width: 100%; }
    .meta, .actions { justify-content: center; }
    .pathbar { white-space: normal; word-break: break-all; }
  }

  @media (prefers-reduced-motion: reduce) {
    .poster .glitch,
    .poster .glitch::before,
    .poster .glitch::after,
    .pathbar .cursor { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">
      <span class="brand">AETHYRION</span>
      <span class="dot"></span>
      <span>library</span>
      <span class="dot"></span>
      <span class="live">● no signal</span>
    </div>

    <div class="grid">
      <div class="poster" id="poster">
        <canvas id="static" width="220" height="330" aria-hidden="true"></canvas>
        <div class="overlay">
          <div class="glitch" aria-hidden="true">404</div>
          <div class="nosignal">no signal</div>
        </div>
      </div>

      <div class="detail">
        <h1 class="headline"><span>Title not found</span></h1>
        <p class="sub">The page you asked for isn't in the library. Could be a dead link, a typo, or something that got deleted on purpose.</p>

        <div class="meta">
          <span class="tag">Unreleased</span>
          <span class="tag">Lost Media</span>
          <span class="tag match">0% match</span>
        </div>

        <div class="pathbar" id="pathbar">
          <span class="label">searching:</span> <span class="q" id="path">/</span><span class="cursor">▌</span>
        </div>

        <div class="actions">
          <button class="btn" id="request">Request it anyway</button>
          <a class="ghost" href="https://discord.gg/UZPWT8PxDe">the only door that works →</a>
        </div>

        <div class="result" id="result" role="status" aria-live="polite"></div>

        <p class="quip" id="quip">welcome to nowhere in particular.</p>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // --- show the path they actually tried to reach ---
      var pathEl = document.getElementById("path");
      var p = window.location.pathname + window.location.search;
      pathEl.textContent = (p && p !== "/") ? p : "/the-page-that-isnt-here";

      // --- TV static on the poster ---
      var canvas = document.getElementById("static");
      var ctx = canvas.getContext("2d");
      var w = canvas.width, h = canvas.height;
      function draw() {
        var img = ctx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var v = (Math.random() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      if (reduce) {
        draw();
      } else {
        var last = 0;
        (function loop(t) {
          if (t - last > 70) { draw(); last = t; } // ~14fps, easy on the CPU
          requestAnimationFrame(loop);
        })(0);
      }

      // --- subtle pointer tilt on the poster ---
      var poster = document.getElementById("poster");
      if (!reduce && window.matchMedia("(pointer: fine)").matches) {
        window.addEventListener("mousemove", function (e) {
          var rx = (e.clientY / window.innerHeight - 0.5) * -8;
          var ry = (e.clientX / window.innerWidth - 0.5) * 8;
          poster.style.transform = "perspective(700px) rotateX(" + rx + "deg) rotateY(" + ry + "deg)";
        });
      }

      // --- rotating quips ---
      var quips = [
        "welcome to nowhere in particular.",
        "even the *arr stack came back empty.",
        "this page left the library and didn't leave a forwarding address.",
        "404 ways to miss a page. you found one.",
        "deleted in a brief moment of clarity.",
        "not indexed, not cached, not coming back.",
        "you typed something hopeful. respect."
      ];
      var qi = 0, quipEl = document.getElementById("quip");
      if (!reduce) {
        setInterval(function () {
          quipEl.style.opacity = "0";
          setTimeout(function () {
            qi = (qi + 1) % quips.length;
            quipEl.textContent = quips[qi];
            quipEl.style.opacity = "1";
          }, 450);
        }, 4200);
      }

      // --- the "request it anyway" gag ---
      var btn = document.getElementById("request");
      var result = document.getElementById("result");
      var fails = [
        "Request failed — that title doesn't exist. Not even Sonarr could grab it.",
        "Sent to the void. The void declined.",
        "No seeders, no sources, no such page. Triple miss.",
        "Radarr searched everywhere. Found vibes, no page."
      ];
      var busy = false;
      btn.addEventListener("click", function () {
        if (busy) return;
        busy = true;
        result.classList.remove("show");
        var original = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Sending to the void…";
        setTimeout(function () {
          btn.textContent = "Request failed";
          result.textContent = fails[(Math.random() * fails.length) | 0];
          result.classList.add("show");
          setTimeout(function () {
            btn.disabled = false;
            btn.textContent = original;
            busy = false;
          }, 2600);
        }, 1500);
      });

      // --- dev easter egg ---
      console.log(
        "%cAETHYRION%c  404 — you went looking, didn't you?\n%cNothing to see in here. The good stuff is at /  (eventually).",
        "font-weight:700;font-size:14px;background:linear-gradient(90deg,#ec4899,#8b5cf6,#38bdf8);-webkit-background-clip:text;color:transparent;",
        "color:#888fad;font-size:12px;",
        "color:#555c78;font-size:11px;"
      );
    })();
  </script>
</body>
</html>
